name: Run Tests

on:
  push:
    branches: ["master", "feature/test-ci"]
  pull_request:
    branches: [ "master"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app_printers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql
        coverage: none

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: dependencies-laravel-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          dependencies-laravel-php-

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Prepare Environment
      run: cp .env.example .env

    - name: Generate Application Key
      run: php artisan key:generate

    # Переопределяем переменные окружения для подключения к поднятому pgsql и запускаем тесты
    - name: Execute Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: app_printers_test
        DB_USERNAME: postgres
        DB_PASSWORD: secret_password
      run: |
        php artisan migrate --force
        php artisan test
