services:
  nginx:
    build:
      context: ./
      dockerfile: docker/prod/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - ${NGINX_PORT}:80
    depends_on:
      - php-fpm
    networks:
      - app-network

  php-fpm:
    build:
      context: ./
      dockerfile: docker/prod/php-fpm/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    build:
      context: ./
      dockerfile: docker/prod/postgres/Dockerfile
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - app-printers-consumable-db:/var/lib/postgresql
    networks:
      - app-network

  migrations:
    build:
      context: ./
      dockerfile: docker/prod/php-cli/Dockerfile
    command: >
      sh -c "until nc -z postgres 5432; do echo 'Waiting for postgres...'; sleep 2; done;
             php artisan migrate --force"
    depends_on:
      - postgres
    restart: no
    networks:
      - app-network

volumes:
  app-printers-consumable-db:

networks:
  app-network:
    driver: bridge
